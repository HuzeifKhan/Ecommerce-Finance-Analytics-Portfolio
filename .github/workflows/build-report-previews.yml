name: Build PDF previews for GitHub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-previews:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Install tools to render PDF -> PNG (prefer Ghostscript).
      - name: Install Ghostscript (and ImageMagick as fallback)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript imagemagick

      # Ensure Pages folder structure and disable Jekyll
      - name: Ensure docs/ folder and .nojekyll
        run: |
          mkdir -p docs/previews
          touch docs/.nojekyll

      # Copy your latest PDF into docs/ so GitHub Pages can serve it
      - name: Copy report PDF
        run: |
          src="06_Reports/Ecommerce_Finance_Insights_Report.pdf"
          dest="docs/Ecommerce_Finance_Insights_Report.pdf"
          if [ -f "$src" ]; then
            cp "$src" "$dest"
          else
            echo "::warning::Report PDF not found at $src"
          fi

      # Render PNG previews from the PDF using Ghostscript
      - name: Render PNG previews from PDF (via Ghostscript)
        run: |
          set -e
          pdf="docs/Ecommerce_Finance_Insights_Report.pdf"
          if [ -f "$pdf" ]; then
            # -dSAFER: secure mode
            # -sDEVICE=png16m: full-color PNG
            # -r200: 200 DPI
            # -o docs/previews/report_page-%02d.png: page-numbered outputs
            gs -dSAFER -dBATCH -dNOPAUSE -sDEVICE=png16m -r200 -o docs/previews/report_page-%02d.png "$pdf"
          else
            echo "::warning::No PDF found to render."
          fi

      # IMPORTANT: Do NOT create or modify docs/index.html here.
      # Your custom homepage stays intact.

      - name: Commit previews and PDF only
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            docs/previews
            docs/Ecommerce_Finance_Insights_Report.pdf
            docs/.nojekyll
          message: "ci(previews): refresh previews + PDF (no homepage changes)"
