name: Refresh PDF report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"   # Auto-run monthly
  push:
    paths:
      - "03_Python/**"
      - "05_Tableau/exports/**"
      - "requirements.txt"
      - ".github/workflows/refresh-report.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate PDF and Excel
        run: |
          python 03_Python/make_report.py

      - name: Copy Tableau exports into docs
        run: |
          mkdir -p docs/assets/tableau
          cp -f 05_Tableau/exports/*.png docs/assets/tableau/ || true

      - name: Commit artifacts (PDF + Excel + Tableau)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage PDF
          if ls 06_Reports/*.pdf 1>/dev/null 2>&1; then
            git add 06_Reports/*.pdf
          fi

          # Stage Excel
          if ls 04_Excel/*.xlsx 1>/dev/null 2>&1; then
            git add 04_Excel/*.xlsx
          fi

          # Stage Tableau exports
          if ls docs/assets/tableau/*.png 1>/dev/null 2>&1; then
            git add docs/assets/tableau/*.png
          fi

          # Commit if any changes
          if ! git diff --cached --quiet; then
            git commit -m "ci: refresh reports + Excel + Tableau ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "No artifact changes detected."
          fi

      - name: Commit cohort artifacts (CSV + PNG)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 01_Data/processed/retention_cohorts.csv 2>/dev/null || true
          git add 03_Analysis/figures/*.png 2>/dev/null || true
          git diff --cached --quiet || git commit -m "ci(cohort): update retention CSV/figure ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push

