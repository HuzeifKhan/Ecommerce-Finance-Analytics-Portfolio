name: Refresh PDF report

on:
  workflow_dispatch:
  # Nightly at 02:00 UTC (= 03:00 CET, 04:00 CEST)
  schedule:
    - cron: "0 2 * * *"
    # Keep your original monthly run (1st day 06:00 UTC)
    - cron: "0 6 1 * *"
  push:
    paths:
      - "03_Python/**"
      - "05_Tableau/exports/**"
      - "requirements.txt"
      - ".github/workflows/refresh-report.yml"

permissions:
  contents: write

concurrency:
  group: refresh-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      START_TS: ${{ github.run_started_at }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate PDF and Excel
        run: |
          python 03_Python/make_report.py

      - name: Copy Tableau exports into docs
        run: |
          mkdir -p docs/assets/tableau
          cp -f 05_Tableau/exports/*.png docs/assets/tableau/ || true

      # --- NEW: Update README "Last Run Summary" block ---
      - name: Update README – Last Run Summary
        shell: bash
        run: |
          set -e
          # Duration since job start
          start_epoch=$(date -u -d "${START_TS}" +%s)
          now_epoch=$(date -u +%s)
          dur=$(( now_epoch - start_epoch ))
          mins=$(( dur / 60 ))
          secs=$(( dur % 60 ))

          utc_now="$(date -u +'%Y-%m-%d %H:%M UTC')"
          berlin_now="$(TZ=Europe/Berlin date +'%Y-%m-%d %H:%M %Z')"

          summary_line="> ✅ Last successful refresh: **${berlin_now}**  \n> ⏱️ Duration: **${mins} min ${secs} sec**  \n> 🌍 UTC: **${utc_now}**"

          tmp_file="$(mktemp)"
          awk -v repl="$summary_line" '
            /<!-- RUN-SUMMARY:START -->/ { print; print repl; skip=1; next }
            /<!-- RUN-SUMMARY:END -->/   { skip=0 }
            skip!=1 { print }
          ' README.md > "$tmp_file"
          mv "$tmp_file" README.md

      # --- SINGLE commit step for everything ---
      - name: Commit artifacts (PDF + Excel + Tableau + Cohort + README)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage artifacts (guard with || true so empty globs don't fail)
          git add 06_Reports/*.pdf                           2>/dev/null || true
          git add 04_Excel/*.xlsx                            2>/dev/null || true
          git add docs/assets/tableau/*.png                  2>/dev/null || true
          git add 01_Data/processed/retention_cohorts.csv    2>/dev/null || true
          git add 03_Analysis/figures/*.png                  2>/dev/null || true
          # Stage README summary
          git add README.md                                  2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "ci: refresh reports & README last-run summary ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # Don't fail the workflow if the push is non–fast-forward
            git push origin "${GITHUB_REF_NAME}" || echo "Non-fast-forward push, remote already has newer commits – skipping."
          else
            echo "No artifact/README changes detected."
          fi
