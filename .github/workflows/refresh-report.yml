name: Refresh PDF report

on:
  # Manual run button in the Actions tab
  workflow_dispatch:

  # Auto-run monthly (1st of each month at 06:00 UTC)
  schedule:
    - cron: "0 6 1 * *"

  # (Optional) Rebuild when these parts change
  push:
    paths:
      - "03_Python/**"
      - "05_Tableau/exports/**"
      - "requirements.txt"
      - ".github/workflows/refresh-report.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build report
        run: python 03_Python/make_report.py
        
      - name: Copy Tableau exports into docs
        run: |
          mkdir -p docs/assets/tableau
          cp -f 05_Tableau/exports/*.png docs/assets/tableau/ || true

      - name: Commit updated images (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/assets/tableau/*.png 2>/dev/null || true
          git diff --cached --quiet || git commit -m "ci: update tableau exports ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push

      - name: Commit PDF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 06_Reports/*.pdf || echo "No report found"
          git commit -m "chore(report): refresh PDF [skip ci]" || echo "No changes to commit"

      - name: Push changes
        run: git push

